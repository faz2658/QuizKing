# Whole QuizCadia platform. Build the jars first:  ./mvnw -DskipTests package
# then:  docker compose up --build      (UI on http://localhost:4280, or QUIZCADIA_HTTP_PORT)
# Images are named ${IMAGE_REGISTRY}/<service>:${IMAGE_TAG}. Locally that's quizcadia/<service>:dev; production
# pulls the images CI built, ghcr.io/faz2658/quizcadia/<service>:<commit> (see .github/workflows/deploy.yml).
name: quizcadia

# Memory: every container has a ceiling, so one that runs away is restarted on its own instead of pushing the
# whole server into swap. Java heaps are 60% of their container (see each Dockerfile). Swap is off per container
# (memswap_limit = mem_limit). Override any limit from .env, e.g. JAVA_MEM_LIMIT=640m.
x-service: &service
  restart: unless-stopped
  mem_limit: ${JAVA_MEM_LIMIT:-640m}
  memswap_limit: ${JAVA_MEM_LIMIT:-640m}
  environment: &env
    EUREKA_URL: http://discovery:8082/eureka
    CONFIG_SERVER_URL: http://config:8083
    KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    GAME_MANAGER_URL: http://game-manager:9091
    # Every service checks the tokens the login service signs with this secret
    QUIZCADIA_JWT_SECRET: ${QUIZCADIA_JWT_SECRET:?set QUIZCADIA_JWT_SECRET (32+ characters)}
    # The site's own address (production: https://<site>). Behind the proxy the services see plain http,
    # so the browser's https requests count as cross-origin and must be allowed here, in every service.
    CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200}
  depends_on:
    kafka:
      condition: service_healthy
    mongo:
      condition: service_started

services:
  # ---- infrastructure ----------------------------------------------------------------
  mongo:
    image: mongo:8.0
    restart: unless-stopped
    # WiredTiger's cache would otherwise take half of the machine's memory
    command: ["--wiredTigerCacheSizeGB", "0.5"]
    mem_limit: 1g
    memswap_limit: 1g
    volumes: [mongo-data:/data/db]
    ports: ["27017:27017"]

  neo4j:
    image: neo4j:5
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-quizcadia-dev-password}
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 384m
      NEO4J_server_memory_pagecache_size: 128m
    mem_limit: 768m
    memswap_limit: 768m
    volumes: [neo4j-data:/data]
    ports: ["7474:7474", "7687:7687"]

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: quizzApp
      MYSQL_USER: ${MYSQL_USER:-quizcadia}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-quizcadia-dev-password}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    mem_limit: 640m
    memswap_limit: 640m
    volumes: [mysql-data:/var/lib/mysql]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      retries: 20

  kafka:
    image: apache/kafka:4.1.0
    restart: unless-stopped
    mem_limit: 768m
    memswap_limit: 768m
    environment:
      KAFKA_HEAP_OPTS: "-Xms384m -Xmx384m"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_MESSAGE_MAX_BYTES: 5242880
      KAFKA_REPLICA_FETCH_MAX_BYTES: 5242880
    ports: ["19092:19092"]
    # A port check, not kafka-topics.sh: that starts a whole JVM (about 3 s of CPU) and ran every 5 s, which was
    # the 1.5-2 core CPU spike seen in the load test (~60% of a core around the clock).
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9092"]
      interval: 10s
      start_period: 20s
      retries: 30

  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    volumes: [./grafana/prometheus.yml:/etc/prometheus/prometheus.yml:ro]
    mem_limit: 384m
    memswap_limit: 384m
    ports: ["9190:9090"]

  grafana:
    image: grafana/grafana:12.1.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-quizcadia-dev-password}
    mem_limit: 320m
    memswap_limit: 320m
    ports: ["3000:3000"]
    depends_on: [prometheus]

  # ---- platform ----------------------------------------------------------------------
  discovery:
    build: ./Quiz-app
    image: ${IMAGE_REGISTRY:-quizcadia}/discovery:${IMAGE_TAG:-dev}
    restart: unless-stopped
    mem_limit: 512m
    memswap_limit: 512m
    environment:
      EUREKA_HOSTNAME: discovery

  config:
    build: ./configuration-service
    image: ${IMAGE_REGISTRY:-quizcadia}/config:${IMAGE_TAG:-dev}
    restart: unless-stopped
    mem_limit: 512m
    memswap_limit: 512m
    environment:
      EUREKA_URL: http://discovery:8082/eureka
    depends_on: [discovery]

  question-generator:
    <<: *service
    build: ./questionGenerator
    image: ${IMAGE_REGISTRY:-quizcadia}/question-generator:${IMAGE_TAG:-dev}
    environment:
      <<: *env
      MONGODB_URI: mongodb://mongo:27017/questiondb
      # Fills an empty question bank from Open Trivia DB (~5,000 questions, takes ~10 minutes)
      OPENTDB_IMPORT_ON_START: "true"
      # Set to http://question-model:8080 when running with --profile ai (see ai/question-model/README.md)
      AI_MODEL_URL: ${AI_MODEL_URL:-}

  game-manager:
    <<: *service
    mem_limit: ${HEAVY_MEM_LIMIT:-896m}
    memswap_limit: ${HEAVY_MEM_LIMIT:-896m}
    build: ./GameManager
    image: ${IMAGE_REGISTRY:-quizcadia}/game-manager:${IMAGE_TAG:-dev}
    environment:
      <<: *env
      MONGODB_URI: mongodb://mongo:27017/gamemanagerdb
      # Every topic with enough questions gets a solo and a multiplayer game automatically
      AUTO_GAMES: "true"

  game-engine:
    <<: *service
    mem_limit: ${HEAVY_MEM_LIMIT:-896m}
    memswap_limit: ${HEAVY_MEM_LIMIT:-896m}
    build: ./game
    image: ${IMAGE_REGISTRY:-quizcadia}/game-engine:${IMAGE_TAG:-dev}
    environment:
      <<: *env
      MONGODB_URI: mongodb://mongo:27017/GameQuestionDb
      # The three small built-in demo games; off because the imported bank replaces them
      DEMO_DATA: "false"

  multiplayer-game-engine:
    <<: *service
    build: ./MultiplayerGameEngine
    image: ${IMAGE_REGISTRY:-quizcadia}/multiplayer-game-engine:${IMAGE_TAG:-dev}
    environment:
      <<: *env
      MONGODB_URI: mongodb://mongo:27017/multiPlayerGameEngine

  adaptive-game-engine:
    <<: *service
    build: ./AdaptiveGameEngine
    image: ${IMAGE_REGISTRY:-quizcadia}/adaptive-game-engine:${IMAGE_TAG:-dev}
    environment:
      <<: *env
      MONGODB_URI: mongodb://mongo:27017/adaptiveGameEngine

  player-matcher:
    <<: *service
    build: ./PlayerMatcher
    image: ${IMAGE_REGISTRY:-quizcadia}/player-matcher:${IMAGE_TAG:-dev}

  recommendations:
    <<: *service
    build: ./recommendations
    image: ${IMAGE_REGISTRY:-quizcadia}/recommendations:${IMAGE_TAG:-dev}
    environment:
      <<: *env
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-quizcadia-dev-password}
    depends_on:
      kafka:
        condition: service_healthy
      neo4j:
        condition: service_started

  search-service:
    <<: *service
    build: ./SearchService
    image: ${IMAGE_REGISTRY:-quizcadia}/search-service:${IMAGE_TAG:-dev}

  login:
    <<: *service
    build: ./login
    image: ${IMAGE_REGISTRY:-quizcadia}/login:${IMAGE_TAG:-dev}
    environment:
      <<: *env
      DATABASE_URL: jdbc:mysql://mysql:3306/quizzApp
      DATABASE_USER: ${MYSQL_USER:-quizcadia}
      DATABASE_PASSWORD: ${MYSQL_PASSWORD:-quizcadia-dev-password}
      QUIZCADIA_JWT_SECRET: ${QUIZCADIA_JWT_SECRET:?set QUIZCADIA_JWT_SECRET (32+ characters)}
      QUIZCADIA_ADMIN_EMAILS: ${QUIZCADIA_ADMIN_EMAILS:-}
      # Where players open the site (reset links in emails point here); production sets it from SITE_ADDRESS
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:4280}
      # "Sign in with Google" (optional): the OAuth client id from Google Cloud
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GA_MEASUREMENT_ID: ${GA_MEASUREMENT_ID:-}
      # Outgoing email for password resets (optional, any SMTP). Unset = links go to the login service log
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-QuizCadia <no-reply@localhost>}
    depends_on:
      kafka:
        condition: service_healthy
      mysql:
        condition: service_healthy

  user-service:
    <<: *service
    build: ./UserService-master
    image: ${IMAGE_REGISTRY:-quizcadia}/user-service:${IMAGE_TAG:-dev}
    environment:
      <<: *env
      MONGODB_URI: mongodb://mongo:27017/UserProfile

  game-reporting:
    <<: *service
    mem_limit: ${HEAVY_MEM_LIMIT:-896m}
    memswap_limit: ${HEAVY_MEM_LIMIT:-896m}
    build: ./GameReporting
    image: ${IMAGE_REGISTRY:-quizcadia}/game-reporting:${IMAGE_TAG:-dev}
    environment:
      <<: *env
      MONGODB_URI: mongodb://mongo:27017/Game_Reports
      # Google Analytics on the admin page: the property's number and a read-only service account key, kept in
      # ./secrets on the server (never committed). Without them the page explains how to set it up.
      GA_PROPERTY_ID: ${GA_PROPERTY_ID:-}
      GA_CREDENTIALS_FILE: ${GA_CREDENTIALS_FILE:-}
    volumes:
      - ./secrets:/run/secrets:ro

  # Fine-tuned question model (optional): docker compose --profile ai up -d
  # Needs ai/question-model/models/quizcadia-q4_k_m.gguf, produced by the Colab notebook.
  question-model:
    profiles: [ai]
    image: ghcr.io/ggml-org/llama.cpp:server
    restart: unless-stopped
    volumes: [./ai/question-model/models:/models:ro]
    # Sleeps (frees the model's ~2.6 GB) after 10 idle minutes and loads it again on the next request, which then
    # takes a few extra seconds. AI quizzes are occasional, so most of the time the memory goes to the game services.
    command: ["-m", "/models/quizcadia-q4_k_m.gguf", "--jinja", "--host", "0.0.0.0", "--port", "8080", "-c", "2048",
              "--alias", "quizcadia", "--sleep-idle-seconds", "${AI_MODEL_IDLE_SECONDS:-600}"]
    # the 2.5 GB model file is memory-mapped and stays resident once loaded
    mem_limit: 3g
    memswap_limit: 3g

  frontend:
    build: ./frontend
    image: ${IMAGE_REGISTRY:-quizcadia}/frontend:${IMAGE_TAG:-dev}
    restart: unless-stopped
    mem_limit: 128m
    memswap_limit: 128m
    ports: ["${QUIZCADIA_HTTP_PORT:-4280}:80"]
    depends_on: [game-engine, game-manager, login]

volumes:
  mongo-data:
  neo4j-data:
  mysql-data:
