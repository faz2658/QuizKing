spring:
  data:
    mongodb:
      # create the indexes declared with @Indexed / @CompoundIndex (off by default in Spring Boot)
      auto-index-creation: true
  application:
    name: question-generator
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8083}
  mongodb:
    uri: ${MONGODB_URI:mongodb://localhost:27017/questiondb}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:19092}
    consumer:
      group-id: question-generator
      auto-offset-reset: earliest
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
        spring.json.trusted.packages: com.fazeel.quizcadia.domain
        spring.json.use.type.headers: false
    producer:
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      # Game definitions carry a topic's whole question pool; compress them and allow up to 5 MB.
      compression-type: zstd
      properties:
        # Kafka down: give up on a message after 5 s (logged) instead of holding the player's request for 60 s
        max.block.ms: 5000
        spring.json.add.type.headers: false
        max.request.size: 5242880

server:
  port: ${PORT:9090}

quizcadia:
  # OpenAI-compatible server with the fine-tuned question model (e.g. llama.cpp's llama-server)
  ai:
    url: ${AI_MODEL_URL:}
    model: ${AI_MODEL_NAME:quizcadia}
  opentdb:
    import-on-start: ${OPENTDB_IMPORT_ON_START:false}
    request-spacing: 5500ms
  kafka:
    enabled: ${KAFKA_ENABLED:true}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  topics:
    questions: QuestionGen.t

eureka:
  client:
    enabled: ${EUREKA_ENABLED:true}
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8082/eureka}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
