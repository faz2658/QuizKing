# Production overrides: HTTPS in front, nothing else reachable from outside.
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml --profile ai up -d --build
# Needs SITE_ADDRESS (the site's one name, e.g. quizcadia.com) and the secrets in .env; optional REDIRECT_ADDRESSES.
services:
  caddy:
    image: caddy:2.10
    restart: unless-stopped
    mem_limit: 256m
    memswap_limit: 256m
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS}
      # Other names that should send visitors to SITE_ADDRESS, e.g. "www.quizcadia.com, 40-233-75-213.sslip.io"
      REDIRECT_ADDRESSES: ${REDIRECT_ADDRESSES:-http://redirect.localhost}
      # A CDN's address ranges, space-separated, when one is in front (see deploy/README.md); empty: none
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-127.0.0.1/32}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [frontend]

  # Only Caddy is public; databases, Kafka and dashboards stay inside the Docker network.
  login:
    environment:
      PUBLIC_URL: https://${SITE_ADDRESS}
  frontend:
    ports: !reset []
  mongo:
    ports: !reset []
  neo4j:
    ports: !reset []
  kafka:
    ports: !reset []
  prometheus:
    ports: !reset []
  grafana:
    ports: !reset []

volumes:
  caddy-data:
  caddy-config:
