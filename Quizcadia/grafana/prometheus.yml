global:
  scrape_interval: 15s

scrape_configs:
  - job_name: quizcadia
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - question-generator:9090
          - game-manager:9091
          - game-engine:9092
          - multiplayer-game-engine:9093
          - adaptive-game-engine:9094
          - recommendations:9095
          - search-service:9096
          - login:9097
          - user-service:9098
          - game-reporting:9099
          - player-matcher:9089
