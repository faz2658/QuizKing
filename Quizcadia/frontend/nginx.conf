# Serves the Angular app and routes /api/* to the right service (same paths as proxy.conf.json in dev).

# Sign-in, sign-up and guest sign-in, per visitor address: 30 a minute on average with bursts of up to 60, so a
# whole quiz night at a pub or office (many players behind one address) can join at once, but scripted floods
# get "429 Too Many Requests". Password guessing is also stopped per account in the login service.
limit_req_zone $binary_remote_addr zone=signin:10m rate=30r/m;
limit_req_status 429;

# Behind an HTTPS proxy (Caddy in production) keep the scheme the browser used.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

# One pool of reusable connections per service. Opening a new connection for every request ran the container out
# of local ports under load ("Address not available"). "resolve" keeps following the service's address and lets
# nginx start even while a service is still down.
resolver 127.0.0.11 valid=10s;
upstream adaptive_game_engine {
    zone adaptive_game_engine 64k;
    server adaptive-game-engine:9094 resolve;
    keepalive 16;
}
upstream game_engine {
    zone game_engine 64k;
    server game-engine:9092 resolve;
    keepalive 16;
}
upstream game_manager {
    zone game_manager 64k;
    server game-manager:9091 resolve;
    keepalive 16;
}
upstream game_reporting {
    zone game_reporting 64k;
    server game-reporting:9099 resolve;
    keepalive 16;
}
upstream login {
    zone login 64k;
    server login:9097 resolve;
    keepalive 16;
}
upstream multiplayer_game_engine {
    zone multiplayer_game_engine 64k;
    server multiplayer-game-engine:9093 resolve;
    keepalive 16;
}
upstream player_matcher {
    zone player_matcher 64k;
    server player-matcher:9089 resolve;
    keepalive 16;
}
upstream question_generator {
    zone question_generator 64k;
    server question-generator:9090 resolve;
    keepalive 16;
}
upstream recommendations {
    zone recommendations 64k;
    server recommendations:9095 resolve;
    keepalive 16;
}
upstream search_service {
    zone search_service 64k;
    server search-service:9096 resolve;
    keepalive 16;
}
upstream user_service {
    zone user_service 64k;
    server user-service:9098 resolve;
    keepalive 16;
}

server {
    include /etc/nginx/snippets/security-headers.conf;
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # The visitor's real address: Caddy (the only thing in front of nginx, on the private Docker network) puts it in
    # X-Forwarded-For and ignores whatever the visitor sent, so it can't be faked. Used by the limits above and
    # passed on as X-Real-IP.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 127.0.0.1;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    proxy_http_version 1.1;
    proxy_set_header Connection "";  # keep upstream connections open for reuse
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header X-Real-IP $remote_addr;

    location /api/v1/sessions {
        proxy_pass http://game_engine;
    }
    location /api/v1/games {
        proxy_pass http://game_engine;
    }
    location /api/v1/daily {
        proxy_pass http://game_engine;
    }
    location /api/v1/arena {
        proxy_pass http://game_engine;
    }
    location /api/v1/knowme {
        proxy_pass http://game_engine;
    }
    location /api/v1/challenges {
        proxy_pass http://game_engine;
    }
    # Full game definitions (whole question pool with answers) are for the game engines only: the game manager
    # serves them on /internal/, which the engines reach directly inside the Docker network. Never let browsers
    # near them. The old public paths are gone from the game manager; these blocks are a second line of defence
    # (the old digits-only rule let "games/mp/+2000002" through).
    location ^~ /internal/ {
        return 404;
    }
    location ~ ^/api/game/(game1|games/mp/.) {
        return 404;
    }
    location /api/game {
        proxy_pass http://game_manager;
    }
    location /api/v1/question-generator {
        proxy_pass http://question_generator;
    }
    location /api/v1/matches {
        proxy_pass http://multiplayer_game_engine;
    }
    location /api/v1/adaptive {
        proxy_pass http://adaptive_game_engine;
    }
    location /api/v1/recommendation {
        proxy_pass http://recommendations;
    }
    location /api/v1/search {
        proxy_pass http://search_service;
    }
    location ~ ^/api/v1/auth/(login|register|guest|google|password/) {
        limit_req zone=signin burst=60 nodelay;
        proxy_pass http://login;
    }
    location /api/v1/auth {
        proxy_pass http://login;
    }
    location /api/v1/users {
        proxy_pass http://user_service;
    }
    location /api/v1/reports {
        proxy_pass http://game_reporting;
    }
    location /api/v1/matching {
        proxy_pass http://player_matcher;
    }

    # Anything else under /api is a mistake: answer 404 instead of the app's index page.
    location /api/ {
        return 404;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The service worker and manifest must always be fresh, or app updates would be stuck behind a 30-day cache.
    location = /sw.js {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
    }
    location = /manifest.webmanifest {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        types { application/manifest+json webmanifest; }
    }
    # Build output carries a content hash in its name (chunk-B-NGkvnr.js, styles-4F2K9QXZ.css, fonts): a new
    # release means new names, so these can be cached for a year without ever being re-checked.
    location ~* "-[A-Za-z0-9_-]{8}\.(js|css|woff2?)$" {
        include /etc/nginx/snippets/security-headers.conf;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }
    # Icons, images, robots.txt and the sitemap keep their names when they change (the favicon did, with the rename):
    # browsers keep them but check each time, and get a cheap "304 not modified" while nothing changed.
    location ~* \.(js|css|woff2?|png|svg|ico|xml|txt)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
    }
}
