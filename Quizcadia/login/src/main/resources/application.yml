spring:
  profiles:
    # local: run from the IDE or ./mvnw (this default); docker: docker compose on a laptop; prod: the live server.
    # Profile settings for every service are in the config server's config-repo/application-<profile>.yml.
    default: local
  application:
    name: login
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8083}
  # H2 file database by default; set DATABASE_URL (e.g. jdbc:mysql://mysql:3306/quizzApp) for MySQL.
  datasource:
    url: ${DATABASE_URL:jdbc:h2:file:./data/login;AUTO_SERVER=TRUE}
    username: ${DATABASE_USER:sa}
    password: ${DATABASE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:19092}
    consumer:
      group-id: login
      auto-offset-reset: earliest
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
        spring.json.trusted.packages: com.fazeel.quizcadia.domain
        spring.json.use.type.headers: false
    producer:
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      properties:
        # Kafka down: give up on a message after 5 s (logged) instead of holding the player's request for 60 s
        max.block.ms: 5000
        spring.json.add.type.headers: false

server:
  port: ${PORT:9097}

quizcadia:
  # Base64 or plain text, at least 32 bytes. Without it a random key is used (tokens die on restart).
  jwt:
    secret: ${QUIZCADIA_JWT_SECRET:}
    # Access tokens: every service accepts one until it runs out, so keep it short. The app renews it.
    lifetime: ${QUIZCADIA_JWT_LIFETIME:15m}
  # Refresh sessions (HttpOnly cookie): unused for `idle` or older than `absolute` means signing in again.
  session:
    idle: ${QUIZCADIA_SESSION_IDLE:30d}
    absolute: ${QUIZCADIA_SESSION_ABSOLUTE:90d}
    guest: ${QUIZCADIA_SESSION_GUEST:1d}
  # Comma-separated emails that get the ADMIN role when they register.
  admin-emails: ${QUIZCADIA_ADMIN_EMAILS:}
  kafka:
    enabled: ${KAFKA_ENABLED:true}
  # The address players open the site at; reset links in emails point here.
  public-url: ${PUBLIC_URL:http://localhost:4200}
  # OAuth client id from Google Cloud ("Web application"). Empty = no "Sign in with Google" button.
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
  # Google Analytics 4 measurement id (G-XXXXXXX). Empty = no analytics; players opt in before it loads.
  analytics-id: ${GA_MEASUREMENT_ID:}
  # Outgoing email (any SMTP service). Without MAIL_HOST, emails are written to the log instead.
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    from: ${MAIL_FROM:QuizCadia <no-reply@localhost>}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  topics:
    user-registered: new-user-created.t

eureka:
  client:
    enabled: ${EUREKA_ENABLED:true}
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8082/eureka}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,jfr,heapdump,threaddump
  metrics:
    tags:
      application: ${spring.application.name}
