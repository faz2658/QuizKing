<mv-aurora />
<a class="skip" href="#main">Skip to content</a>
<header class="bar">
  <div class="container inner">
    <a class="brand" routerLink="/">
      <span class="logo" aria-hidden="true"><svg class="crown" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 8.5l4.2 3.6L12 5l4.8 7.1L21 8.5 19.3 18H4.7z" fill="currentColor"/><rect x="4.7" y="19.2" width="14.6" height="2" rx="1" fill="currentColor"/></svg></span>
      <span>Quiz King</span>
    </a>
    @if (auth.user(); as user) {
      <nav aria-label="Main">
        <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Games</a>
        <a routerLink="/leaderboard" routerLinkActive="active">Leaderboard</a>
        <a routerLink="/me" routerLinkActive="active">My stats</a>
        @if (auth.isAdmin()) { <a routerLink="/admin" routerLinkActive="active">Create</a> }
      </nav>
      <div class="spacer"></div>
      <button type="button" class="icon-btn" [attr.aria-pressed]="fx.settings().sound" [attr.aria-label]="fx.settings().sound ? 'Sound on' : 'Sound off'"
        [title]="fx.settings().sound ? 'Sound on' : 'Sound off'" (click)="fx.toggle('sound')">{{ fx.settings().sound ? '🔊' : '🔇' }}</button>
      <button type="button" class="icon-btn" [attr.aria-pressed]="fx.settings().vibration" [attr.aria-label]="fx.settings().vibration ? 'Vibration on' : 'Vibration off'"
        [title]="fx.settings().vibration ? 'Vibration on (phones)' : 'Vibration off'" (click)="fx.toggle('vibration')"><span [class.off]="!fx.settings().vibration">📳</span></button>
      <span class="who" [title]="user.email || 'Guest player'">
        <span class="avatar" aria-hidden="true">{{ user.userName.charAt(0).toUpperCase() }}</span>
        <span class="name">{{ user.userName }}</span>
      </span>
      <button type="button" class="btn btn-ghost" (click)="logout()">{{ user.role === 'GUEST' ? 'Leave' : 'Log out' }}</button>
    }
  </div>
</header>
<main id="main" class="container">
  <router-outlet />
</main>
<footer class="container foot muted">Quiz King · think fast, play smart · Trivia questions from <a href="https://opentdb.com" target="_blank" rel="noopener">Open Trivia DB</a> (CC BY-SA 4.0)</footer>
