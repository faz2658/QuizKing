# Serves the Angular app and routes /api/* to the right service (same paths as proxy.conf.json in dev).
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Resolve upstreams per request so nginx starts even if a service is down.
    resolver 127.0.0.11 valid=10s;

    location /api/v1/sessions {
        set $upstream http://game-engine:9092;
        proxy_pass $upstream;
    }
    location /api/v1/games {
        set $upstream http://game-engine:9092;
        proxy_pass $upstream;
    }
    # Full game definitions (whole question pool with answers) are for the game engines only, which
    # reach the game manager directly inside the network. Never serve them to browsers.
    location ~ ^/api/game/(game1/|games/mp/[0-9]+) {
        return 404;
    }
    location /api/game {
        set $upstream http://game-manager:9091;
        proxy_pass $upstream;
    }
    location /api/v1/question-generator {
        set $upstream http://question-generator:9090;
        proxy_pass $upstream;
    }
    location /api/v1/matches {
        set $upstream http://multiplayer-game-engine:9093;
        proxy_pass $upstream;
    }
    location /api/v1/adaptive {
        set $upstream http://adaptive-game-engine:9094;
        proxy_pass $upstream;
    }
    location /api/v1/recommendation {
        set $upstream http://recommendations:9095;
        proxy_pass $upstream;
    }
    location /api/v1/search {
        set $upstream http://search-service:9096;
        proxy_pass $upstream;
    }
    location /api/v1/auth {
        set $upstream http://login:9097;
        proxy_pass $upstream;
    }
    location /api/v1/users {
        set $upstream http://user-service:9098;
        proxy_pass $upstream;
    }
    location /api/v1/reports {
        set $upstream http://game-reporting:9099;
        proxy_pass $upstream;
    }
    location /api/v1/matching {
        set $upstream http://player-matcher:9089;
        proxy_pass $upstream;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|woff2?|png|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
