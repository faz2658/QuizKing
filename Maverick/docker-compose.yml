# Whole Maverick platform. Build the jars first:  ./mvnw -DskipTests package
# then:  docker compose up --build      (UI on http://localhost:4280, or MAVERICK_HTTP_PORT)
name: maverick

x-service: &service
  restart: unless-stopped
  environment: &env
    EUREKA_URL: http://discovery:8082/eureka
    CONFIG_SERVER_URL: http://config:8083
    KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    GAME_MANAGER_URL: http://game-manager:9091
    # Every service checks the tokens the login service signs with this secret
    MAVERICK_JWT_SECRET: ${MAVERICK_JWT_SECRET:?set MAVERICK_JWT_SECRET (32+ characters)}
  depends_on:
    kafka:
      condition: service_healthy
    mongo:
      condition: service_started

services:
  # ---- infrastructure ----------------------------------------------------------------
  mongo:
    image: mongo:8.0
    restart: unless-stopped
    volumes: [mongo-data:/data/db]
    ports: ["27017:27017"]

  neo4j:
    image: neo4j:5
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-maverick-dev-password}
    volumes: [neo4j-data:/data]
    ports: ["7474:7474", "7687:7687"]

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: quizzApp
      MYSQL_USER: maverick
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-maverick-dev-password}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    volumes: [mysql-data:/var/lib/mysql]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      retries: 20

  kafka:
    image: apache/kafka:4.1.0
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_MESSAGE_MAX_BYTES: 5242880
      KAFKA_REPLICA_FETCH_MAX_BYTES: 5242880
    ports: ["19092:19092"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 5s
      retries: 30

  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    volumes: [./grafana/prometheus.yml:/etc/prometheus/prometheus.yml:ro]
    ports: ["9190:9090"]

  grafana:
    image: grafana/grafana:12.1.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-maverick-dev-password}
    ports: ["3000:3000"]
    depends_on: [prometheus]

  # ---- platform ----------------------------------------------------------------------
  discovery:
    build: ./Quiz-app
    restart: unless-stopped
    environment:
      EUREKA_HOSTNAME: discovery

  config:
    build: ./configuration-service
    restart: unless-stopped
    environment:
      EUREKA_URL: http://discovery:8082/eureka
    depends_on: [discovery]

  question-generator:
    <<: *service
    build: ./questionGenerator
    environment:
      <<: *env
      MONGODB_URI: mongodb://mongo:27017/questiondb
      # Fills an empty question bank from Open Trivia DB (~5,000 questions, takes ~10 minutes)
      OPENTDB_IMPORT_ON_START: "true"
      # Set to http://question-model:8080 when running with --profile ai (see ai/question-model/README.md)
      AI_MODEL_URL: ${AI_MODEL_URL:-}

  game-manager:
    <<: *service
    build: ./GameManager
    environment:
      <<: *env
      MONGODB_URI: mongodb://mongo:27017/gamemanagerdb
      # Every topic with enough questions gets a solo and a multiplayer game automatically
      AUTO_GAMES: "true"

  game-engine:
    <<: *service
    build: ./game
    environment:
      <<: *env
      MONGODB_URI: mongodb://mongo:27017/GameQuestionDb
      # The three small built-in demo games; off because the imported bank replaces them
      DEMO_DATA: "false"

  multiplayer-game-engine:
    <<: *service
    build: ./MultiplayerGameEngine
    environment:
      <<: *env
      MONGODB_URI: mongodb://mongo:27017/multiPlayerGameEngine

  adaptive-game-engine:
    <<: *service
    build: ./AdaptiveGameEngine
    environment:
      <<: *env
      MONGODB_URI: mongodb://mongo:27017/adaptiveGameEngine

  player-matcher:
    <<: *service
    build: ./PlayerMatcher

  recommendations:
    <<: *service
    build: ./recommendations
    environment:
      <<: *env
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-maverick-dev-password}
    depends_on:
      kafka:
        condition: service_healthy
      neo4j:
        condition: service_started

  search-service:
    <<: *service
    build: ./SearchService

  login:
    <<: *service
    build: ./login
    environment:
      <<: *env
      DATABASE_URL: jdbc:mysql://mysql:3306/quizzApp
      DATABASE_USER: maverick
      DATABASE_PASSWORD: ${MYSQL_PASSWORD:-maverick-dev-password}
      MAVERICK_JWT_SECRET: ${MAVERICK_JWT_SECRET:?set MAVERICK_JWT_SECRET (32+ characters)}
      MAVERICK_ADMIN_EMAILS: ${MAVERICK_ADMIN_EMAILS:-}
      # The site's own address when served over HTTPS behind a proxy (production)
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200}
    depends_on:
      kafka:
        condition: service_healthy
      mysql:
        condition: service_healthy

  user-service:
    <<: *service
    build: ./UserService-master
    environment:
      <<: *env
      MONGODB_URI: mongodb://mongo:27017/UserProfile

  game-reporting:
    <<: *service
    build: ./GameReporting
    environment:
      <<: *env
      MONGODB_URI: mongodb://mongo:27017/Game_Reports

  # Fine-tuned question model (optional): docker compose --profile ai up -d
  # Needs ai/question-model/models/quiz-king-q4_k_m.gguf, produced by the Colab notebook.
  question-model:
    profiles: [ai]
    image: ghcr.io/ggml-org/llama.cpp:server
    restart: unless-stopped
    volumes: [./ai/question-model/models:/models:ro]
    command: ["-m", "/models/quiz-king-q4_k_m.gguf", "--jinja", "--host", "0.0.0.0", "--port", "8080", "-c", "2048", "--alias", "quiz-king"]
    deploy:
      resources:
        limits:
          memory: 5g

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports: ["${MAVERICK_HTTP_PORT:-4280}:80"]
    depends_on: [game-engine, game-manager, login]

volumes:
  mongo-data:
  neo4j-data:
  mysql-data:
