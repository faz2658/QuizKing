spring:
  application:
    name: login
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8083}
  # H2 file database by default; set DATABASE_URL (e.g. jdbc:mysql://mysql:3306/quizzApp) for MySQL.
  datasource:
    url: ${DATABASE_URL:jdbc:h2:file:./data/login;AUTO_SERVER=TRUE}
    username: ${DATABASE_USER:sa}
    password: ${DATABASE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:19092}
    consumer:
      group-id: login
      auto-offset-reset: earliest
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
        spring.json.trusted.packages: com.fazeel.maverick.domain
        spring.json.use.type.headers: false
    producer:
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      properties:
        spring.json.add.type.headers: false

server:
  port: ${PORT:9097}

maverick:
  # Base64 or plain text, at least 32 bytes. Without it a random key is used (tokens die on restart).
  jwt:
    secret: ${MAVERICK_JWT_SECRET:}
    lifetime: ${MAVERICK_JWT_LIFETIME:8h}
  # Comma-separated emails that get the ADMIN role when they register.
  admin-emails: ${MAVERICK_ADMIN_EMAILS:}
  kafka:
    enabled: ${KAFKA_ENABLED:true}
  # The address players open the site at; reset links in emails point here.
  public-url: ${PUBLIC_URL:http://localhost:4200}
  # OAuth client id from Google Cloud ("Web application"). Empty = no "Sign in with Google" button.
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
  # Outgoing email (any SMTP service). Without MAIL_HOST, emails are written to the log instead.
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    from: ${MAIL_FROM:Quiz King <no-reply@localhost>}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  topics:
    user-registered: new-user-created.t

eureka:
  client:
    enabled: ${EUREKA_ENABLED:true}
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8082/eureka}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
