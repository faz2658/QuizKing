name: CI

on:
  push:            # every branch, so pushing a feature branch runs CI too
  pull_request:
  workflow_dispatch: # "Run workflow" button on the Actions tab

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (13 services)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Quizcadia
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # verify = compile + unit tests + Testcontainers integration tests (Docker is available on the runner)
      - run: ./mvnw -B verify

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Quizcadia/frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: Quizcadia/frontend/package-lock.json
      - run: npm ci
      - run: npm test -- --watch=false
      - run: npm run build

  images:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    defaults:
      run:
        working-directory: Quizcadia
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: ./mvnw -B -DskipTests package
      - run: QUIZCADIA_JWT_SECRET=ci-only-secret-that-is-long-enough-123 docker compose build
