name: CI

on:
  push:            # every branch, so pushing a feature branch runs CI too
  pull_request:
  workflow_dispatch: # "Run workflow" button on the Actions tab

# On a feature branch or pull request a new push cancels the run it replaces. On master every commit gets a run of
# its own, never cancelled: the deploy only follows a CI run that passed, so a cancelled master run (a new merge, or
# re-running an older commit) would leave that commit undeployed.
concurrency:
  group: ci-${{ github.ref == 'refs/heads/master' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  # The master queue: after a merge, wait until every earlier master build and the production deploy that follows it
  # have finished, then build. Merges are built and deployed one at a time, oldest first, none cancelled. Other
  # branches and pull requests pass straight through. See .github/scripts/master-queue.sh.
  queue:
    name: Master queue
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      actions: read   # to see the other CI and Deploy runs
      contents: read  # to check out the script
    steps:
      - uses: actions/checkout@v5
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        with:
          sparse-checkout: .github/scripts
      - name: Wait for earlier merges to be built and deployed
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          QUEUE_REPO: ${{ github.repository }}
          QUEUE_RUN_ID: ${{ github.run_id }}
        run: bash .github/scripts/master-queue.sh

  backend:
    name: Backend (13 services)
    needs: queue
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Quizcadia
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # verify = compile + unit tests + Testcontainers integration tests (Docker is available on the runner)
      - run: ./mvnw -B verify

  frontend:
    name: Frontend
    needs: queue
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Quizcadia/frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: Quizcadia/frontend/package-lock.json
      - run: npm ci
      - run: npm test -- --watch=false
      - run: npm run build

  images:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    defaults:
      run:
        working-directory: Quizcadia
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: ./mvnw -B -DskipTests package
      - run: QUIZCADIA_JWT_SECRET=ci-only-secret-that-is-long-enough-123 docker compose build
