name: Deploy

# Ships to the live server (Oracle, https://40-233-75-213.sslip.io) once CI has passed on the main branch,
# i.e. after a pull request is merged. Can also be started by hand from the Actions tab.
#
# 1. "Build images" compiles the jars and builds every app image on an ARM runner (the server is ARM too),
#    tagged with the commit, and pushes them to GitHub's container registry: ghcr.io/faz2658/quizcadia/<service>.
# 2. "Deploy" copies the compose files to the server and runs deploy/deploy.sh there, which only pulls the new
#    images and restarts the services whose image changed. Nothing is compiled on the live server any more.
#
# Repository secrets (Settings > Secrets and variables > Actions), see Quizcadia/deploy/README.md:
#   ORACLE_SSH_KEY       private key allowed to log in as ubuntu@server
#   ORACLE_HOST          server address, e.g. 40.233.75.213
#   ORACLE_KNOWN_HOSTS   the server's SSH host key line, so the connection can't be intercepted
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false # never stop a deploy halfway; the next one waits

# The repository's default token is read-only; these jobs ask for exactly what they need.
permissions:
  contents: read

env:
  SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
  IMAGE_REGISTRY: ghcr.io/faz2658/quizcadia
  # Every service built from this repository (the rest are stock images: databases, Kafka, Caddy, ...)
  APP_SERVICES: >-
    discovery config question-generator game-manager game-engine multiplayer-game-engine adaptive-game-engine
    player-matcher recommendations search-service login user-service game-reporting frontend

jobs:
  images:
    name: Build images
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04-arm # same CPU architecture as the server, so no emulation
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: Quizcadia
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.SHA }} # build exactly the commit CI tested

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build the jars
        run: ./mvnw -B -q -DskipTests package

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the images
        env:
          IMAGE_TAG: ${{ env.SHA }}
          QUIZCADIA_JWT_SECRET: build-only-placeholder-never-used-at-runtime
        run: |
          docker compose build $APP_SERVICES
          docker compose push $APP_SERVICES

  deploy:
    name: Deploy to production
    needs: images
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read # the server pulls the images with this job's token
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.SHA }}

      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.ORACLE_KNOWN_HOSTS }}
          HOST: ${{ secrets.ORACLE_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf 'Host live\n  HostName %s\n  User ubuntu\n  IdentityFile ~/.ssh/deploy_key\n  IdentitiesOnly yes\n  StrictHostKeyChecking yes\n  ServerAliveInterval 30\n' "$HOST" > ~/.ssh/config

      - name: Upload the release (compose files, Caddyfile, scripts)
        run: |
          ssh live 'rm -rf ~/quizcadia-next && mkdir ~/quizcadia-next'
          git archive --format=tar.gz HEAD:Quizcadia | ssh live 'tar -xzf - -C ~/quizcadia-next'

      - name: Pull the new images and restart what changed
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # The token goes over SSH on stdin, never on a command line; it stops working when this job ends.
        run: printf '%s' "$TOKEN" | ssh live "bash ~/quizcadia-next/deploy/deploy.sh $SHA $IMAGE_REGISTRY ${{ github.actor }}"

      - name: Remove the key from the runner
        if: always()
        run: rm -f ~/.ssh/deploy_key
