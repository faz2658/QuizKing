spring:
  data:
    mongodb:
      # create the indexes declared with @Indexed / @CompoundIndex (off by default in Spring Boot)
      auto-index-creation: true
  application:
    name: game-manager
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8083}
  mongodb:
    uri: ${MONGODB_URI:mongodb://localhost:27017/gamemanagerdb}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:19092}
    consumer:
      group-id: game-manager
      auto-offset-reset: earliest
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
        spring.json.trusted.packages: com.fazeel.quizking.domain
        spring.json.use.type.headers: false
    producer:
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      # Game definitions carry a topic's whole question pool; compress them and allow up to 5 MB.
      compression-type: zstd
      properties:
        spring.json.add.type.headers: false
        max.request.size: 5242880

server:
  port: ${PORT:9091}

quizking:
  auto-games:
    enabled: ${AUTO_GAMES:false}
    min-questions: 12
    solo-questions: 10
    multiplayer-questions: 8
  kafka:
    enabled: ${KAFKA_ENABLED:true}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  topics:
    game-created: created-new-game.t
    game-definition: gameManager.t
    multiplayer-game-created: created-new-multiplayer-game.t
    game-deleted: deleted-game-by-id.t
    questions: QuestionGen.t
    game-request: GameEng.t

eureka:
  client:
    enabled: ${EUREKA_ENABLED:true}
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8082/eureka}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
