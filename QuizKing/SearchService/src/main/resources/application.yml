spring:
  application:
    name: search-service
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8083}

server:
  port: ${PORT:9096}

quizking:
  game-manager-url: ${GAME_MANAGER_URL:http://localhost:9091}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}

eureka:
  client:
    enabled: ${EUREKA_ENABLED:true}
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8082/eureka}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
