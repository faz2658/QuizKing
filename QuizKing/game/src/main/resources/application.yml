spring:
  data:
    mongodb:
      # create the indexes declared with @Indexed / @CompoundIndex (off by default in Spring Boot)
      auto-index-creation: true
  application:
    name: game-engine
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8083}
  mongodb:
    uri: ${MONGODB_URI:mongodb://localhost:27017/GameQuestionDb}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:19092}
    consumer:
      group-id: game-engine
      auto-offset-reset: earliest
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
        spring.json.trusted.packages: com.fazeel.quizking.domain,java.lang
        spring.json.use.type.headers: false
        spring.json.value.default.type: com.fazeel.quizking.domain.Game
    producer:
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      properties:
        spring.json.add.type.headers: false

server:
  port: ${PORT:9092}

quizking:
  kafka:
    enabled: ${KAFKA_ENABLED:true}
  demo-data: ${DEMO_DATA:false}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  topics:
    game-deleted: deleted-game-by-id.t
    game-definition: gameManager.t
    game-request: GameEng.t
    single-player-result: Results3.t

eureka:
  client:
    enabled: ${EUREKA_ENABLED:true}
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8082/eureka}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
