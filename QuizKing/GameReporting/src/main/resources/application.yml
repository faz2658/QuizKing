spring:
  data:
    mongodb:
      # create the indexes declared with @Indexed / @CompoundIndex (off by default in Spring Boot)
      auto-index-creation: true
  application:
    name: game-reporting
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8083}
  mongodb:
    uri: ${MONGODB_URI:mongodb://localhost:27017/Game_Reports}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:19092}
    consumer:
      group-id: game-reporting
      auto-offset-reset: earliest
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
        spring.json.trusted.packages: com.fazeel.quizking.domain
        spring.json.use.type.headers: false
    producer:
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      properties:
        spring.json.add.type.headers: false

server:
  port: ${PORT:9099}

quizking:
  # Google Analytics numbers on the admin page (read-only service account). Empty = the page explains the setup.
  analytics:
    property-id: ${GA_PROPERTY_ID:}
    credentials-file: ${GA_CREDENTIALS_FILE:}
  kafka:
    enabled: ${KAFKA_ENABLED:true}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  topics:
    single-player-result: Results3.t
    multiplayer-result: multiplayerresult.ts
    adaptive-result: AdaptiveResult.t
    user-registered: new-user-created.t

eureka:
  client:
    enabled: ${EUREKA_ENABLED:true}
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8082/eureka}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
